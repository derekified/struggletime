[package]
name = "st-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StruggleTime menu bar / system tray (native binary)"

[[bin]]
name = "struggletime-tray"
path = "src/main.rs"

[dependencies]
st-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
open = "5"

# Graphical tray + SVG→PNG on desktop OS with a menu bar / notification area.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.19"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
