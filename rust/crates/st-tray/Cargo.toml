[package]
name = "st-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StruggleTime menu bar / system tray (native binary)"

[[bin]]
name = "struggletime-tray"
path = "src/main.rs"

[dependencies]
st-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

# Graphical tray on desktop OS where users expect a menu-bar / notification-area icon.
# Linux uses the headless supervisor (no GTK link) so CI and servers stay lean.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.19"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["png"] }
