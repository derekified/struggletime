[package]
name = "struggletime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StruggleTime single binary — tray, CLI, daemon, and local HTTP server"

[[bin]]
name = "struggletime"
path = "src/main.rs"

[features]
default = []
# Forward Linux AppIndicator tray (GTK). Used by release CI on Linux.
linux-tray = ["st-tray/linux-tray"]

[dependencies]
st-core = { workspace = true }
st-daemon = { path = "../st-daemon" }
st-server = { path = "../st-server" }
st-helper = { path = "../st-helper" }
st-tray = { path = "../st-tray" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
