[package]
name = "struggletime-dashboard"
version = "0.1.0"
edition = "2021"
description = "StruggleTime desktop dashboard and tracker controls"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
st-core = { path = "../../rust/crates/st-core" }
url = "2"
open = "5"
rfd = "0.15"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
