<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="StruggleTime dashboard preview" class="hero-shot">
  <!-- TODO: replace with captured fake stats screenshot -->
  <!-- Theme tokens: inherits page --* vars when inlined; lime fallbacks when served alone -->
  <defs>
    <style>
      .hs-bg{fill:var(--bg,#0d0c0a)}
      .hs-panel{fill:var(--panel,#191817);stroke:var(--line,#2e2b28)}
      .hs-panel2{fill:var(--panel2,#211f1d)}
      .hs-line{fill:var(--line,#2e2b28);stroke:var(--line,#2e2b28)}
      .hs-ink{fill:var(--ink,#f2efe9)}
      .hs-mut{fill:var(--mut,#a39e93)}
      .hs-accent{fill:var(--accent,#d7ff6a);stroke:var(--accent,#d7ff6a)}
      .hs-accent2{fill:var(--accent2,#ff8c37);stroke:var(--accent2,#ff8c37)}
      .hs-bar{fill:var(--bar,#d7ff6a);stroke:var(--bar,#d7ff6a)}
      .hs-frame{fill:url(#hs-grad);stroke:var(--line,#2e2b28)}
      #hs-grad .a{stop-color:var(--panel,#191817)}
      #hs-grad .b{stop-color:var(--panel2,#211f1d)}
    </style>
    <linearGradient id="hs-grad" x1="0" y1="0" x2="1" y2="1">
      <stop class="a" offset="0%"/>
      <stop class="b" offset="100%"/>
    </linearGradient>
