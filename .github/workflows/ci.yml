name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux tray / linker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            pkg-config
      - name: fmt
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --workspace
      - name: build unified binary
        working-directory: rust
        run: cargo build --release -p struggletime
      - name: build with AppIndicator tray
        working-directory: rust
        run: cargo build --release -p struggletime --features linux-tray
      - name: adapter suite
        run: sh scripts/verify_adapters.sh
      - name: stage linux package smoke
        run: |
          chmod +x scripts/*.sh
          sh scripts/stage_release.sh struggletime-linux-x86_64 rust/target/release/struggletime /tmp/st-dist
          test -x /tmp/st-dist/struggletime-linux-x86_64/struggletime
          test -f /tmp/st-dist/struggletime-linux-x86_64/install.sh
          test -f /tmp/st-dist/struggletime-linux-x86_64/struggletime.desktop

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: install + build docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
