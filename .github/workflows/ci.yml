name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux tray / linker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            pkg-config
      - name: fmt
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --workspace
      - name: build unified binary
        working-directory: rust
        run: cargo build --release -p struggletime
      - name: build with AppIndicator tray
        working-directory: rust
        run: cargo build --release -p struggletime --features linux-tray
      - name: adapter suite
        run: sh scripts/verify_adapters.sh
      - name: stage linux package smoke
        run: |
          chmod +x scripts/*.sh
          sh scripts/stage_release.sh struggletime-linux-x86_64 rust/target/release/struggletime /tmp/st-dist
          test -x /tmp/st-dist/struggletime-linux-x86_64/struggletime
          test -f /tmp/st-dist/struggletime-linux-x86_64/install.sh
          test -f /tmp/st-dist/struggletime-linux-x86_64/struggletime.desktop

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev
      - name: Install and build local frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build CLI sidecar
        working-directory: desktop
        run: node scripts/prepare-sidecar.mjs --profile debug
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: install + build docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
