name: auto-release

# After CI succeeds on main, cut the next patch tag so `release` builds assets.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit tag (e.g. v0.1.3). Leave empty to auto-bump."
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag-and-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need a token that can push tags / dispatch workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next tag
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin

          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            LATEST="$(git tag -l 'v*' | sort -V | tail -1 || true)"
            if [ -z "$LATEST" ]; then
              TAG="v0.1.0"
            else
              # vMAJOR.MINOR.PATCH → bump PATCH
              RAW="${LATEST#v}"
              MAJOR="${RAW%%.*}"
              REST="${RAW#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              PATCH="${PATCH%%[^0-9]*}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          case "$TAG" in
            v*.*.*) ;;
            *) echo "invalid tag: $TAG"; exit 1 ;;
          esac

          # Prefer the commit CI just validated when available.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="$(git rev-parse HEAD)"
          fi

          # Avoid a second release for a commit that was already force-tagged.
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "SHA $SHA already has a version tag — skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "Will release $TAG at $SHA"

      - name: Create tag (triggers release workflow on v*)
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="${{ steps.ver.outputs.sha }}"
          git tag -a "$TAG" "$SHA" -m "StruggleTime $TAG"
          git push origin "$TAG"
          echo "tagged $TAG — release.yml runs on tag push"
