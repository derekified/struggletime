name: release-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-universal
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        working-directory: rust
        run: cargo build --release
      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          OUT="dist/binaries/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          for b in struggletime-helper struggletime-daemon struggletime-server struggletime-tray; do
            cp "rust/target/release/$b" "$OUT/"
          done
          ( cd dist/binaries && zip -qr "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}" )
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/binaries/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($b in @("struggletime-helper","struggletime-daemon","struggletime-server","struggletime-tray")) {
            Copy-Item "rust/target/release/$b.exe" "$out/"
          }
          Compress-Archive -Path $out -DestinationPath "dist/binaries/${{ matrix.artifact }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: struggletime-${{ matrix.artifact }}
          path: dist/binaries/${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          find artifacts -name '*.zip' -print0 | xargs -0 -I{} gh release upload "$TAG" {} --clobber
