name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: struggletime-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: struggletime-macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: struggletime-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: struggletime-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux tray / linker deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            pkg-config
      - name: Build release binary
        working-directory: rust
        run: |
          EXTRA=
          if [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA="--features linux-tray"
          fi
          cargo build --release -p struggletime --target ${{ matrix.target }} $EXTRA
        shell: bash
      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          BIN="rust/target/${{ matrix.target }}/release/struggletime"
          mkdir -p dist
          sh scripts/stage_release.sh "${{ matrix.artifact }}" "$BIN" dist
          (
            cd dist
            tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            # Also ship a ready-to-open .app zip on macOS arch builds
            if [ -d "${{ matrix.artifact }}/StruggleTime.app" ]; then
              ditto -c -k --sequesterRsrc --keepParent \
                "${{ matrix.artifact }}/StruggleTime.app" \
                "${{ matrix.artifact }}-app.zip" 2>/dev/null \
                || (cd "${{ matrix.artifact }}" && zip -qr "../${{ matrix.artifact }}-app.zip" StruggleTime.app)
              shasum -a 256 "${{ matrix.artifact }}-app.zip" > "${{ matrix.artifact }}-app.zip.sha256"
            fi
          )
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "rust/target/${{ matrix.target }}/release/struggletime.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          bash scripts/stage_release.sh "${{ matrix.artifact }}" $bin dist
          Compress-Archive -Path "dist\${{ matrix.artifact }}\*" -DestinationPath "dist\${{ matrix.artifact }}.zip" -Force
          Copy-Item $bin "dist\struggletime-windows-x64.exe"
          $hashZip = (Get-FileHash "dist\${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist\${{ matrix.artifact }}.zip.sha256" -Value "$hashZip  ${{ matrix.artifact }}.zip"
          $hashExe = (Get-FileHash "dist\struggletime-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist\struggletime-windows-x64.exe.sha256" -Value "$hashExe  struggletime-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
            dist/struggletime-windows-x64.exe*

  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Make universal binary + app
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          mkdir -p dist /tmp/arm /tmp/intel
          tar -xzf artifacts/struggletime-macos-aarch64/struggletime-macos-aarch64.tar.gz -C /tmp/arm
          tar -xzf artifacts/struggletime-macos-intel/struggletime-macos-intel.tar.gz -C /tmp/intel
          mkdir -p /tmp/uni
          lipo -create \
            /tmp/arm/struggletime-macos-aarch64/struggletime \
            /tmp/intel/struggletime-macos-intel/struggletime \
            -output /tmp/uni/struggletime
          chmod +x /tmp/uni/struggletime
          lipo -info /tmp/uni/struggletime
          sh scripts/stage_release.sh struggletime-macos-universal /tmp/uni/struggletime dist
          (
            cd dist
            tar -czf struggletime-macos-universal.tar.gz struggletime-macos-universal
            shasum -a 256 struggletime-macos-universal.tar.gz > struggletime-macos-universal.tar.gz.sha256
            ditto -c -k --sequesterRsrc --keepParent \
              struggletime-macos-universal/StruggleTime.app \
              struggletime-macos-universal-app.zip
            shasum -a 256 struggletime-macos-universal-app.zip > struggletime-macos-universal-app.zip.sha256
          )
      - uses: actions/upload-artifact@v4
        with:
          name: struggletime-macos-universal
          path: |
            dist/struggletime-macos-universal.tar.gz
            dist/struggletime-macos-universal.tar.gz.sha256
            dist/struggletime-macos-universal-app.zip
            dist/struggletime-macos-universal-app.zip.sha256

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag must start with v (got: $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble SHA256SUMS + publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.sha256' \) -print0 \
            | xargs -0 -I{} cp -f {} upload/
          (
            cd upload
            : > SHA256SUMS.txt
            for f in *.tar.gz *.zip *.exe; do
              [ -f "$f" ] || continue
              if [ -f "$f.sha256" ]; then
                cat "$f.sha256" >> SHA256SUMS.txt
              else
                sha256sum "$f" >> SHA256SUMS.txt
              fi
            done
            ls -la
            test -f struggletime-macos-universal.tar.gz
            test -f struggletime-macos-intel.tar.gz
            test -f struggletime-windows-x64.exe
            test -f struggletime-linux-x86_64.tar.gz
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --tags origin
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
          cat > /tmp/release-notes.md <<EOF
          ## Downloads

          Each OS package is **one** \`struggletime\` binary used as both the desktop tray app and the CLI.

          - **macOS Universal** — \`struggletime-macos-universal.tar.gz\` (+ \`…-app.zip\` for StruggleTime.app)
          - **macOS Intel** — \`struggletime-macos-intel.tar.gz\`
          - **Windows x64** — \`struggletime-windows-x64.exe\` / \`.zip\` (run \`install.ps1\`)
          - **Linux x86_64** — \`struggletime-linux-x86_64.tar.gz\` (run \`install.sh\`)

          Verify with \`SHA256SUMS.txt\`.

          ### macOS (Universal)

          \`\`\`bash
          curl -fLO https://github.com/derekified/struggletime/releases/download/${TAG}/struggletime-macos-universal.tar.gz
          curl -fLO https://github.com/derekified/struggletime/releases/download/${TAG}/struggletime-macos-universal.tar.gz.sha256
          shasum -a 256 -c struggletime-macos-universal.tar.gz.sha256
          tar -xzf struggletime-macos-universal.tar.gz
          sh struggletime-macos-universal/install.sh struggletime-macos-universal/struggletime
          struggletime --version
          \`\`\`

          ### Linux

          \`\`\`bash
          curl -fLO https://github.com/derekified/struggletime/releases/download/${TAG}/struggletime-linux-x86_64.tar.gz
          tar -xzf struggletime-linux-x86_64.tar.gz
          sh struggletime-linux-x86_64/install.sh struggletime-linux-x86_64/struggletime
          struggletime --version
          \`\`\`

          ### Windows

          Download \`struggletime-windows-x64.zip\`, then:

          \`\`\`powershell
          powershell -ExecutionPolicy Bypass -File .\\install.ps1
          struggletime --version
          \`\`\`
          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "StruggleTime $TAG" \
            --notes-file /tmp/release-notes.md
          gh release upload "$TAG" upload/* --clobber
